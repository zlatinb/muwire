import java.nio.file.*
import java.util.jar.*
import java.util.zip.*

plugins {
    id 'com.gradleup.shadow' version '9.2.2' apply false
}

def stripJar = { File file ->
    if (file.name.endsWith('.tar'))
        return
    println "stripping $file"
    File newFile = new File(file.parent, 'tmp-' + file.name)
    Set<String> names = new HashSet<>()
    new JarOutputStream(new FileOutputStream(newFile)).withCloseable { out ->
        new ZipInputStream(new BufferedInputStream(new FileInputStream(file))).withCloseable { input ->
            ZipEntry entry
            while ((entry = input.nextEntry) != null) {
                if (!names.add(entry.name))
                    continue
                def copy = new JarEntry(entry.name)
                copy.time = 1001
                out.putNextEntry(copy)
                byte[] buffer = new byte[8192]
                int read
                while ((read = input.read(buffer)) != -1)
                    out.write(buffer, 0, read)
            }
        }
        out.finish()
    }
    Files.copy(newFile.toPath(), file.toPath(), StandardCopyOption.REPLACE_EXISTING)
    newFile.delete()
}

subprojects {
    apply plugin: 'groovy'
    apply plugin: 'java-library'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencies {
        api "org.codehaus.groovy:groovy:${groovyVersion}"
        api "org.codehaus.groovy:groovy-jsr223:${groovyVersion}"
        api "org.codehaus.groovy:groovy-json:${groovyVersion}"
        api "com.h2database:h2:1.4.200"
        api "org.codehaus.groovy:groovy-sql:${groovyVersion}"
    }

    compileGroovy {
        groovyOptions.optimizationOptions.indy = false
        sourceCompatibility = project.sourceCompatibility
        targetCompatibility = project.targetCompatibility
        options.compilerArgs += project.compilerArgs
        options.deprecation = true
        options.encoding = 'UTF-8'
    }

    compileJava {
        sourceCompatibility = project.sourceCompatibility
        targetCompatibility = project.targetCompatibility
        options.compilerArgs += project.compilerArgs
        options.deprecation = true
        options.encoding = 'UTF-8'
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(AbstractArchiveTask) {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
        doLast {
            stripJar(it.archiveFile.get().asFile)
        }
    }
    
    tasks.withType(Jar) {
        metadataCharset = "US-ASCII"
    }
}
